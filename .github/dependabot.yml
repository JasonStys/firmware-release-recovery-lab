# File: dependabot.yml
# Purpose: Opens bounded weekly dependency and workflow update proposals.
# Variables: package ecosystem, directory, cadence, and PR limits.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

